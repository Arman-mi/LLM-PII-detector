<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Mini Tecto Options</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 180px;
      }
      button {
        margin-top: 12px;
        padding: 10px 14px;
      }
      .status {
        margin-top: 10px;
      }

    <div class="status" id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
